name: Verificar y desplegar Azure dev

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue activo; GitHub conserva solo la última ejecución pendiente.
concurrency:
  group: azure-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  FRONTEND_REPOSITORY: ezeellena2/ArquitecturaBaseFront
  IMAGE_REPOSITORY: arquitecturabase/app
  IMAGE_TAG: dev-${{ github.run_id }}-${{ github.run_attempt }}
  # Partes de las matrices del front (iguales a sus listas `shard`); el paquete exige el mismo commit en todas.
  BROWSER_SHARDS: 4
  FRONT_UNIT_SHARDS: 6

defaults:
  run:
    shell: bash

jobs:
  # Las capturas enteras tardan ~25 min en el runner: cada parte hace una porción con los mismos 3 workers.
  browser:
    name: Probar recorridos y capturas en Chromium (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Descargar front
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: main
          path: frontend
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Registrar el front verificado
        working-directory: frontend
        run: git rev-parse HEAD > ../tested-frontend-sha.txt
      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium
      # Windows corta a veces una navegación suelta con net::ERR_NO_BUFFER_SPACE: el reintento la repite, el informe la
      # marca «flaky» y una captura distinta falla igual en los dos intentos.
      - name: Probar navegador real
        working-directory: frontend
        run: npm run test:visual -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --retries=1
      - name: Guardar la revisión probada
        uses: actions/upload-artifact@v4
        with:
          name: tested-frontend-browser-${{ matrix.shard }}
          path: tested-frontend-sha.txt
          if-no-files-found: error
      - name: Guardar diagnóstico de fallas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # vitest usa la mitad de los núcleos (2 en el runner): entero pasaría la hora, partido queda en minutos.
  front:
    name: Probar el front (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Descargar front
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: main
          path: frontend
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Registrar el front verificado
        working-directory: frontend
        run: git rev-parse HEAD > ../tested-frontend-sha.txt
      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del front
        working-directory: frontend
        run: npm ci
      - name: Probar el front
        working-directory: frontend
        run: npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Guardar la revisión probada
        uses: actions/upload-artifact@v4
        with:
          name: tested-frontend-unit-${{ matrix.shard }}
          path: tested-frontend-sha.txt
          if-no-files-found: error

  # La integración (un Postgres y un Redis por colección, 2 hilos en el runner) se parte por módulo: WhatsApp y
  # Formularios son casi tres cuartos del tiempo. «resto» excluye exactamente lo que corren las otras dos.
  backend:
    name: Probar .NET con PostgreSQL y Redis reales (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: WhatsApp
            tests: >-
              --project tests/ArquitecturaBase.Api.IntegrationTests/ArquitecturaBase.Api.IntegrationTests.csproj
              --configuration Release --no-build
              -- --filter-namespace 'ArquitecturaBase.Api.IntegrationTests.Modules.WhatsApp*'
          - part: Formularios
            tests: >-
              --project tests/ArquitecturaBase.Api.IntegrationTests/ArquitecturaBase.Api.IntegrationTests.csproj
              --configuration Release --no-build
              -- --filter-namespace 'ArquitecturaBase.Api.IntegrationTests.Modules.BusinessForms*'
          - part: resto
            tests: >-
              --solution ArquitecturaBase.slnx --configuration Release --no-build
              -- --filter-not-namespace 'ArquitecturaBase.Api.IntegrationTests.Modules.WhatsApp*'
              --filter-not-namespace 'ArquitecturaBase.Api.IntegrationTests.Modules.BusinessForms*'
    steps:
      - name: Descargar backend
        uses: actions/checkout@v6
        with:
          path: backend
          persist-credentials: false

      - name: Instalar .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      # La imagen de la Api (aspnet:10.0, Ubuntu 24.04) trae los nombres viejos de zona, como America/Buenos_Aires, que es
      # lo que ICU da para «Argentina Standard Time»; el runner de Ubuntu los tiene aparte, en tzdata-legacy.
      - name: Instalar las zonas horarias de la imagen
        run: sudo apt-get update -q && sudo apt-get install -y -q tzdata-legacy

      - name: Restaurar .NET
        working-directory: backend
        run: dotnet restore ArquitecturaBase.slnx

      - name: Compilar .NET
        working-directory: backend
        run: dotnet build ArquitecturaBase.slnx --configuration Release --no-restore

      # Las pruebas del robot de ARCA (ADR 0026) recorren páginas simuladas con Chromium, en la versión que pide Playwright.
      - name: Instalar Chromium para el robot de ARCA
        working-directory: backend
        run: pwsh tests/ArquitecturaBase.Api.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Probar .NET
        working-directory: backend
        run: dotnet test ${{ matrix.tests }}

  build:
    name: Verificar y preparar el paquete
    runs-on: ubuntu-latest
    needs: [browser, front, backend]
    timeout-minutes: 20
    steps:
      - name: Descargar backend
        uses: actions/checkout@v6
        with:
          path: backend
          persist-credentials: false

      - name: Descargar front
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: main
          path: frontend
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Instalar .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Recuperar las revisiones probadas del front
        uses: actions/download-artifact@v4
        with:
          pattern: tested-frontend-*
          path: tested-frontend

      - name: Exigir el mismo front para pruebas y paquete
        run: |
          packaged=$(git -C frontend rev-parse HEAD)
          shopt -s nullglob
          files=(tested-frontend/*/tested-frontend-sha.txt)
          expected=$((BROWSER_SHARDS + FRONT_UNIT_SHARDS))
          [[ ${#files[@]} -eq $expected ]] || { echo "::error::Se esperaban $expected revisiones probadas del front y llegaron ${#files[@]}."; exit 1; }
          for file in "${files[@]}"; do
            tested=$(tr -d '\r\n' < "$file")
            [[ "$tested" == "$packaged" ]] || { echo "::error::El front cambió entre sus pruebas (${file%/*}) y el paquete; repetir la ejecución."; exit 1; }
          done

      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del front
        working-directory: frontend
        run: npm ci

      - name: Revisar reglas del front
        working-directory: frontend
        run: npm run lint

      - name: Compilar React
        working-directory: frontend
        run: npm run build

      - name: Incluir React en la API
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/silent-renew.html
          mkdir -p backend/src/ArquitecturaBase.Api/wwwroot
          cp -a frontend/dist/. backend/src/ArquitecturaBase.Api/wwwroot/

      - name: Crear imagen sin conectarse a Azure
        working-directory: backend
        run: |
          mkdir -p .artifacts/deploy
          dotnet publish src/ArquitecturaBase.Api/ArquitecturaBase.Api.csproj \
            --configuration Release --runtime linux-x64 --self-contained false \
            --output .artifacts/publish /t:PublishContainer \
            -p:ContainerRepository="$IMAGE_REPOSITORY" \
            -p:ContainerImageTag="$IMAGE_TAG" \
            -p:ContainerArchiveOutputPath="$PWD/.artifacts/deploy/image.tar.gz"

      - name: Comprobar todos los archivos del front publicados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          source = Path("frontend/dist")
          destination = Path("backend/.artifacts/publish/wwwroot")
          files = [path for path in source.rglob("*") if path.is_file()]
          assert files, "The frontend build is empty."
          for path in files:
              target = destination / path.relative_to(source)
              assert target.is_file(), f"Missing published asset: {path.relative_to(source)}"
              assert sha256(path.read_bytes()).digest() == sha256(target.read_bytes()).digest(), f"Changed asset: {path.relative_to(source)}"
          print(f"Verified {len(files)} published frontend files.")
          PY

      - name: Instalar EF
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Generar bundle de migraciones sin tocar una base
        working-directory: backend
        env:
          ConnectionStrings__appdb: Host=localhost;Database=design;Username=design;Password=design
          ConnectionStrings__cache: localhost:6379,abortConnect=false
        run: |
          dotnet ef migrations bundle \
            --project src/ArquitecturaBase.Infrastructure \
            --startup-project src/ArquitecturaBase.Api \
            --configuration Release --self-contained --target-runtime linux-x64 \
            --output .artifacts/deploy/efbundle \
            -- --environment Development

      - name: Registrar versiones del paquete
        run: |
          backend_sha=$(git -C backend rev-parse HEAD)
          frontend_sha=$(git -C frontend rev-parse HEAD)
          jq -n --arg backend "$backend_sha" --arg frontend "$frontend_sha" \
            --arg image "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            '{backend: $backend, frontend: $frontend, image: $image}' \
            > backend/.artifacts/deploy/manifest.json
          {
            echo "### Paquete verificado"
            echo "- Backend: $backend_sha"
            echo "- Front: $frontend_sha"
            echo "- Imagen: $IMAGE_REPOSITORY:$IMAGE_TAG"
            echo "- Azure se actualiza solo con DEV_DEPLOY_ENABLED=true."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: azure-dev-package
          path: backend/.artifacts/deploy/
          if-no-files-found: error
          # Un cliente recibe el paquete de una corrida verde de dev (deploy-production.yml): se guarda un mes.
          retention-days: 30

  # Publica dev con el paso compartido con los clientes. Cada push lo intenta; un paquete superado por main se omite.
  deploy:
    name: Publicar en Azure dev
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEV_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/publish-azure.yml
    with:
      environment: dev
      package-run-id: ${{ github.run_id }}
      skip-superseded: true
    secrets: inherit
